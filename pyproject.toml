[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-scribe"
version = "0.1.0"
description = "Conventional Commit messages and release notes from your staged diff, written by a small local model."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "git-scribe contributors" }]
keywords = ["git", "commit", "conventional-commits", "changelog", "release-notes", "llm", "ollama", "git-hook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
git-scribe = "git_scribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
